name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build
        run: cargo build --workspace

      - name: Test (single run — GPU parity suites are deterministic, no stress loops)
        run: cargo test --workspace
