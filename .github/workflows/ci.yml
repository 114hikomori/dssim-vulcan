name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install lavapipe (software Vulkan) + validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-validationlayers

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy --toolchain stable

      # F21: lint our crates with -D warnings. --no-deps keeps the gate off the
      # upstream dssim-core fork (which has pre-existing style warnings we do
      # not own); benches are excluded because they need nightly (#![feature(test)]).
      - name: Clippy (our crates, warnings are errors)
        run: >
          cargo clippy -p dssim-vulkan -p dssim --no-deps
          --lib --bins --tests --examples -- -D warnings

      - name: Build
        run: cargo build --workspace

      # F21: the debug build enables the Khronos validation layer when present
      # (now installed above), and context.rs prints its state. Fail the job if
      # any validation error surfaces -- previously "validation clean" was never
      # actually tested in CI (the layer was absent). --nocapture is REQUIRED:
      # cargo test captures a passing test's stderr, which would swallow the
      # messenger's "[vulkan ERROR]" lines and make the grep gate vacuous.
      - name: Test (validation-enabled; fail on any Vulkan validation error)
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test.log
          if grep -qE "\[vulkan ERROR\]|VUID-" test.log; then
            echo "::error::Vulkan validation errors detected in CI:"
            grep -E "\[vulkan ERROR\]|VUID-" test.log | head -40
            exit 1
          fi
          echo "validation layer state:"
          grep -m1 "validation layer:" test.log || echo "  (no validation-layer line found -- layer may be absent)"

      # BH6: llvmpipe is a unified device, so the default run above only ever
      # exercises the zero-copy upload branch; the staging CopyBuffer branch
      # (score.rs) had ZERO CI coverage. Re-run the GPU crate's tests with
      # DSSIM_UNIFIED=0 to force staging, and assert the override actually
      # engaged (the "upload path: staging" line) -- otherwise this leg would
      # pass vacuously if the env var were ever ignored.
      - name: Test staging upload path (DSSIM_UNIFIED=0)
        run: |
          set -o pipefail
          DSSIM_UNIFIED=0 cargo test -p dssim-vulkan -- --nocapture 2>&1 | tee staging.log
          if grep -qE "\[vulkan ERROR\]|VUID-" staging.log; then
            echo "::error::Vulkan validation errors on the staging upload path:"
            grep -E "\[vulkan ERROR\]|VUID-" staging.log | head -40
            exit 1
          fi
          if ! grep -q "upload path: staging" staging.log; then
            echo "::error::DSSIM_UNIFIED=0 did not engage the staging path (override ignored?)"
            exit 1
          fi
          echo "staging upload path exercised and validation-clean"
